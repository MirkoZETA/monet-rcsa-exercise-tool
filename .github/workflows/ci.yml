name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Smoke test shortest-path routing
        run: ./build/monet-exercise Germany-14nodes 1 3 1 "${{ runner.temp }}/shortest-path"

      - name: Smoke test disjoint-path routing
        run: ./build/monet-exercise Germany-14nodes 2 3 1 "${{ runner.temp }}/disjoint-path"

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image without publishing
        run: docker build --tag monet-rcsa-exercise-tool:ci .
